spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# MongoDB Atlas
spring.mongodb.uri=${MONGO_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Claude API (Deprecated, now handled by Microservice)
claude.api.key=${CLAUDE_API_KEY}

# AI Microservice Configuration
ai.microservice.use-localhost=${AI_MICROSERVICE_USE_LOCALHOST:true}
ai.microservice.local-url=${AI_MICROSERVICE_LOCAL_URL:http://localhost:8000}
ai.microservice.prod-url=${AI_MICROSERVICE_PROD_URL:https://tu-url-de-produccion.com}

# N8n Webhook
n8n.webhook.url=${N8N_WEBHOOK_URL:}

# CoinGate Configuration
coingate.api.key=${COINGATE_API_TOKEN:}
coingate.api.url=${COINGATE_API_URL:https://api-sandbox.coingate.com/v2}
backend.url=${BACKEND_URL:http://localhost:8080}

# SendGrid Email
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:no-reply@workflowsystem.com}

# Firebase Cloud Messaging
firebase.project.id=${FIREBASE_PROJECT_ID:}

# Azure Blob Storage
AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:}
AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

